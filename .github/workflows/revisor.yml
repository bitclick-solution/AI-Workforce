name: Revisor

# Dispara al Revisor (.claude/agents/revisor.md) en cada PR listo para revisión.
# Autenticación: ANTHROPIC_API_KEY (clave de la consola de la API) o CLAUDE_CODE_OAUTH_TOKEN
# (token de una suscripción de Claude, `claude setup-token`). Para actualizar el tablero, NOTION_TOKEN.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: revisor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  comprobar:
    name: Comprobar secretos
    runs-on: ubuntu-24.04
    outputs:
      hay_clave: ${{ steps.clave.outputs.hay_clave }}
    steps:
      - id: clave
        env:
          HAY_CLAVE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "hay_clave=$HAY_CLAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAY_CLAVE" != "true" ]; then
            echo "::notice::Sin ANTHROPIC_API_KEY ni CLAUDE_CODE_OAUTH_TOKEN: el Revisor no se ejecuta. Ver docs/runbooks/proteccion-de-rama.md."
          fi

  revisor:
    name: Revisor
    needs: comprobar
    if: needs.comprobar.outputs.hay_clave == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # El workspace solo existe cuando la rebanada del monorepo está en la rama.
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v5
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: Revisar el PR
        id: revisar
        uses: anthropics/claude-code-action@v1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Actúa como el Revisor definido en .claude/agents/revisor.md y sigue CLAUDE.md.
            Repositorio: ${{ github.repository }}. PR número ${{ github.event.pull_request.number }}.
            Rama: ${{ github.event.pull_request.head.ref }} hacia ${{ github.event.pull_request.base.ref }}.

            1. Lee la descripción del PR y localiza el enlace a la rebanada de Notion y a docs/specs/<rebanada>.md.
            2. Obtén el diff completo con `gh pr diff ${{ github.event.pull_request.number }}` y el estado de la CI con `gh pr checks ${{ github.event.pull_request.number }}`.
            3. Aplica las comprobaciones del rol en su orden: reglas del tablero, zonas críticas de .github/CODEOWNERS, fronteras de arquitectura, corrección, secretos, alcance.
            4. Publica un único comentario de revisión con `gh pr review ${{ github.event.pull_request.number }} --comment --body "<contenido>"` (o `--request-changes` si el veredicto es bloqueado). No tienes herramienta para escribir un archivo aparte: construye el cuerpo del comentario como el argumento de `--body`. El comentario termina con una línea `Veredicto: favorable | favorable con cambios menores | bloqueado` y con la firma "— Revisor (agente)".
            5. Si el servidor MCP de Notion está disponible, actualiza la rebanada según el rol: Demostrada si es favorable y no toca zona crítica; nota en Bloqueo si es bloqueado. Si no está disponible, dilo en el comentario.
            No modifiques archivos ni hagas commits. No fusiones.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --mcp-config .github/mcp/notion.json
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(pnpm lint:*),Bash(pnpm typecheck:*),Bash(pnpm test:*),Bash(pnpm evals:smoke:*),mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,mcp__Notion"
      - name: Diagnóstico si el action falla
        if: failure() && steps.revisar.outcome == 'failure'
        env:
          SALIDA: ${{ runner.temp }}/claude-execution-output.json
        run: |
          # Solo el resultado final: tipo, error y número de turnos. Nunca la transcripción completa.
          if [ ! -f "$SALIDA" ]; then
            echo "No existe $SALIDA: el action falló antes de ejecutar Claude Code."
            exit 0
          fi
          jq -r '
            (if type == "array" then .[] else . end)
            | select(.type == "result")
            | "subtype=\(.subtype) is_error=\(.is_error) turnos=\(.num_turns) coste=\(.total_cost_usd)\nerror: \((.result // .error // "sin mensaje") | tostring | .[0:600])"
          ' "$SALIDA" || echo "No se pudo leer el resultado en $SALIDA."
