name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Tipos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  evals-smoke:
    name: Evals de humo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm evals:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: packages/evals/evals-report
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @aiw/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secretos:
    name: Sin secretos en el repositorio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks sobre los commits de este cambio
        env:
          RANGO: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # En la primera subida de una rama no hay commit anterior: se escanea toda la historia hasta HEAD.
          case "$RANGO" in 0000000000000000000000000000000000000000..*) RANGO="${RANGO#*..}" ;; esac
          echo "Rango: $RANGO"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --log-opts="$RANGO" --redact --verbose --exit-code 1

  compose:
    name: Compose de desarrollo arranca
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decidir si hace falta arrancar
        id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # El arranque completo tarda varios minutos: solo corre si el PR toca lo que lo afecta.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "arrancar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(deploy/|scripts/|\.env\.example$|\.github/workflows/ci\.yml$)'; then
            echo "arrancar=true" >> "$GITHUB_OUTPUT"
          else
            echo "arrancar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca deploy/, scripts/, .env.example ni ci.yml: se valida el fichero pero no se arranca el Compose."
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # Este job no instala pnpm; setup-node v5 intentaría usarlo para la caché.
          package-manager-cache: false
      - name: Validar el fichero
        run: |
          node scripts/dev-up.mjs --solo-env
          docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml config --quiet
      - name: Arrancar con un solo comando
        if: steps.cambios.outputs.arrancar == 'true'
        run: node scripts/dev-up.mjs
      - name: Estado de los servicios
        if: always() && steps.cambios.outputs.arrancar == 'true'
        run: docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml ps
      - name: Registros si algo falló
        if: failure() && steps.cambios.outputs.arrancar == 'true'
        run: docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml logs --tail=100
      - name: Parar
        if: always() && steps.cambios.outputs.arrancar == 'true'
        run: node scripts/dev-down.mjs --volumes

  imagenes:
    name: Imagen ${{ matrix.app }}
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, platform-agents, channels, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app == 'web' && 'deploy/docker/web.Dockerfile' || 'deploy/docker/service.Dockerfile' }}
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: aiw/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: La imagen arranca
        if: matrix.app != 'web'
        run: docker run --rm aiw/${{ matrix.app }}:ci
