name: CI

# runs-on de cada job sale de la variable de repositorio AIW_RUNS_ON (JSON de
# etiquetas, p. ej. '["self-hosted","linux","x64","aiw"]'); sin la variable,
# sigue siendo ubuntu-24.04. Volver a los ejecutores de GitHub es borrar o
# vaciar esa variable, sin tocar ningún job. Ver docs/runbooks/ejecutores-auto-hospedados.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Bedrock UE real (ADR-017, rebanada «Modelos v1»): una vez a la semana, no en
    # cada PR, para no pagar modelos en cada revisión (decisión de Jesús,
    # 2026-09-25). Lunes 02:17 UTC.
    - cron: '17 2 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  lint:
    name: Lint y formato
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Tipos
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Pruebas
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  bedrock-integracion:
    name: Bedrock UE · integración (nocturna o manual)
    # Nunca en cada PR (decisión de Jesús, 2026-09-25: no pagar modelos en cada
    # revisión): solo por el cron de arriba o a mano desde la pestaña Actions, y
    # solo sobre main — la relación de confianza de OIDC de aiw-ci-bedrock solo
    # admite ese ref (docs/runbooks/bedrock-iam-oidc.md), así que en un PR
    # fallaría al asumir el rol.
    # Sin claves de AWS guardadas: el rol aiw-ci-bedrock se asume por OIDC.
    # Sin AWS_ROLE_ARN todavía, el job no falla: solo dice que no hay nada que
    # probar.
    if: |
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Asumir aiw-ci-bedrock por OIDC
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AIW_BEDROCK_REGION_UE }}
      - name: Bedrock UE real
        if: vars.AWS_ROLE_ARN != ''
        env:
          AIW_BEDROCK_REGION_UE: ${{ vars.AIW_BEDROCK_REGION_UE }}
          AIW_BEDROCK_IDENTIFICADOR_MODELO: ${{ vars.AIW_BEDROCK_IDENTIFICADOR_MODELO }}
        run: |
          pnpm --filter @aiw/models test:integracion:bedrock
          pnpm --filter @aiw/evals exec vitest run smoke/cobros-modelos-v1.bedrock.integracion.test.ts smoke/conciliacion-modelos-v1.bedrock.integracion.test.ts
      - name: Sin AWS_ROLE_ARN todavía
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "Falta la variable de repositorio AWS_ROLE_ARN, nada que probar todavía."
          echo "Ver docs/runbooks/bedrock-iam-oidc.md."

  vertex-integracion:
    name: Vertex UE · integración (manual, sin cuota)
    # Vertex UE queda implementado y documentado, pero inactivo (ADR-023, revisado
    # el 29-9-2026: Google tampoco concede cuota de la familia 5 — Bedrock UE
    # clásico vuelve a ser el principal). Por eso este job es solo manual, sin el
    # cron semanal que sí lleva "Bedrock UE · integración": no tiene sentido pagar
    # una comprobación semanal de un proveedor que hoy no puede completar ninguna
    # petición. En cuanto Google conceda la cuota, añadir aquí el mismo evento
    # 'schedule' que usa el job de Bedrock es el único cambio (docs/runbooks/vertex-wif.md).
    # Solo sobre main — la condición de confianza de la federación de identidades
    # de aiw-ci-vertex solo admite ese ref, así que en un PR fallaría al cambiar el
    # token de identidad de GitHub por credenciales de Google Cloud.
    # Sin credenciales guardadas: la cuenta de servicio aiw-ci-vertex se asume por
    # federación de identidades (WIF), como con Bedrock y OIDC.
    # Sin AIW_VERTEX_WIF_PROVIDER todavía, el job no falla: solo dice que no hay
    # nada que probar.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Asumir aiw-ci-vertex por federación de identidades
        if: vars.AIW_VERTEX_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AIW_VERTEX_WIF_PROVIDER }}
          service_account: ${{ vars.AIW_VERTEX_WIF_SERVICE_ACCOUNT }}
      - name: Vertex UE real
        if: vars.AIW_VERTEX_WIF_PROVIDER != ''
        env:
          AIW_VERTEX_REGION_UE: ${{ vars.AIW_VERTEX_REGION_UE }}
          AIW_VERTEX_PROJECT_ID: ${{ vars.AIW_VERTEX_PROJECT_ID }}
        run: |
          pnpm --filter @aiw/models test:integracion:vertex
          pnpm --filter @aiw/evals exec vitest run smoke/cobros-modelos-v1.vertex.integracion.test.ts smoke/conciliacion-modelos-v1.vertex.integracion.test.ts
      - name: Sin AIW_VERTEX_WIF_PROVIDER todavía
        if: vars.AIW_VERTEX_WIF_PROVIDER == ''
        run: |
          echo "Falta la variable de repositorio AIW_VERTEX_WIF_PROVIDER, nada que probar todavía."
          echo "Ver docs/runbooks/vertex-wif.md."

  base-de-datos:
    name: Base de datos
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          # Base efímera del runner, sin contraseña a propósito: así no hay ninguna
          # credencial escrita en el repositorio, ni siquiera de juguete.
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aiworkforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/aiworkforce
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Migración, aislamiento, inmutabilidad, purga, contador, aprobación, gateway y carga reducida
        # Concurrencia 1 a propósito: los paquetes comparten una sola base y alguna
        # suite vacía el libro de auditoría al terminar.
        run: pnpm --workspace-concurrency=1 --filter @aiw/db --filter @aiw/ledger --filter @aiw/learning --filter @aiw/api --filter @aiw/channels --filter @aiw/mcp-gateway test

  flujos-durables:
    name: Flujos durables
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          # Base efímera del runner, sin contraseña a propósito: así no hay ninguna
          # credencial escrita en el repositorio, ni siquiera de juguete.
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aiworkforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/aiworkforce
      # El secreto del conector de demostración se genera en el runner y muere con él.
      # Que sea aleatorio importa: la prueba de secretos rastrea su valor por las trazas
      # y el libro, y un valor fijo escrito aquí sería una credencial en el repositorio.
      DEMO_CONECTOR_SECRETO: ${{ github.run_id }}-${{ github.run_attempt }}-demo
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Migrar la base antes de los flujos
        run: pnpm --filter @aiw/db db:migrar
      - name: Bucle, políticas, presupuesto, durabilidad, reintentos y delegación
        # `@temporalio/testing` descarga su servidor de pruebas la primera vez. Si no
        # pudiera, las pruebas que lo necesitan se saltan diciendo por qué y el resto
        # —bucle, políticas, presupuesto, auditoría y empaquetado del flujo— corre igual.
        run: pnpm --filter @aiw/worker test

  # Un millón de filas tarda lo suyo: solo corre si el PR toca el esquema, y a mano
  # desde la pestaña de acciones cuando alguien quiera volver a medir.
  base-de-datos-carga-decidir:
    name: Base de datos · carga · decidir
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    outputs:
      medir: ${{ steps.cambios.outputs.medir }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "medir=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^packages/db/'; then
            echo "medir=true" >> "$GITHUB_OUTPUT"
          else
            echo "medir=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca packages/db/: no se vuelve a medir la carga. Lánzalo a mano con workflow_dispatch si hace falta."
          fi

  base-de-datos-carga:
    name: Base de datos · carga
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    needs: [base-de-datos-carga-decidir]
    if: needs.base-de-datos-carga-decidir.outputs.medir == 'true'
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          # Base efímera del runner, sin contraseña a propósito: así no hay ninguna
          # credencial escrita en el repositorio, ni siquiera de juguete.
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aiworkforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/aiworkforce
      AIW_PRUEBA_CARGA: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Un millón de entradas, cien mil mensajes y el panel por debajo de 200 ms
        run: pnpm --filter @aiw/db exec vitest run src/pruebas/carga.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-de-carga
          path: packages/db/bench/informe.md
          if-no-files-found: ignore

  evals-smoke:
    name: Evals de humo
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm evals:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-report
          path: packages/evals/evals-report
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  # El e2e arranca @aiw/web con la fuente simulada (playwright.config.ts): solo
  # corre de verdad si el PR toca lo que puede afectarle. Si se salta, GitHub
  # cuenta el check "Playwright" como superado.
  e2e-decidir:
    name: Playwright · decidir
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    outputs:
      correr: ${{ steps.cambios.outputs.correr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(apps/web/|packages/|e2e/|playwright\.config\.ts$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "correr=true" >> "$GITHUB_OUTPUT"
          else
            echo "correr=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca apps/web/, packages/, e2e/ ni playwright.config.ts: se salta el e2e."
          fi

  e2e:
    name: Playwright
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    needs: [build, e2e-decidir]
    if: needs.e2e-decidir.outputs.correr == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @aiw/web build
      # --with-deps llama a sudo apt-get: solo en los ejecutores de GitHub. En los
      # auto-hospedados las librerías se instalan una vez a mano (runbook de ejecutores).
      - run: pnpm exec playwright install${{ runner.environment == 'github-hosted' && ' --with-deps' || '' }} chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secretos:
    name: Sin secretos en el repositorio
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks sobre los commits de este cambio
        env:
          RANGO: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # En la primera subida de una rama no hay commit anterior: se escanea toda la historia hasta HEAD.
          case "$RANGO" in 0000000000000000000000000000000000000000..*) RANGO="${RANGO#*..}" ;; esac
          echo "Rango: $RANGO"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --log-opts="$RANGO" --redact --verbose --exit-code 1

  entorno-local:
    name: Entorno local arranca desde cero
    # Antes «Compose de desarrollo arranca» (`node scripts/dev-up.mjs`): la rebanada
    # «Entorno local» lo sustituye por `pnpm local:arrancar`, que además migra,
    # siembra la demo y arranca api y web. Mismo criterio que el job anterior para
    # cuándo arrancar de verdad —deploy/, scripts/, .env.example o este fichero—:
    # un cambio en apps/ o packages/ ya lo cubren sus propios jobs (Tipos, Pruebas,
    # Flujos durables...), y este es el job caro (Compose completo + api + web), así
    # que no se amplía el disparador para no sumar coste de Actions sin necesidad
    # (aviso de coste del 28-9-2026, con la cuenta ya en 36 €).
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 25
    env:
      # En el VPS del ejecutor propio el 3000 y el 3001 los ocupan servicios del host.
      LANGFUSE_PORT: '13001'
      AIW_WEB_PUERTO: '13000'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Decidir si hace falta arrancar
        id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # El arranque completo tarda varios minutos: solo corre si el PR toca lo que lo afecta.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "arrancar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(deploy/|scripts/|\.env\.example$|\.github/workflows/ci\.yml$)'; then
            echo "arrancar=true" >> "$GITHUB_OUTPUT"
          else
            echo "arrancar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca lo que afecta al arranque local: se valida el fichero del Compose pero no se ejecuta pnpm local:arrancar."
          fi
      - uses: actions/setup-node@v5
        if: steps.cambios.outputs.arrancar != 'true'
        with:
          node-version-file: .node-version
          # Solo el camino ligero: sin pnpm install, setup-node v5 no necesita cache.
          package-manager-cache: false
      - name: Validar el fichero del Compose (camino ligero)
        if: steps.cambios.outputs.arrancar != 'true'
        run: |
          node scripts/dev-up.mjs --solo-env
          docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml config --quiet
      - uses: ./.github/actions/setup
        if: steps.cambios.outputs.arrancar == 'true'
      - name: Arrancar desde cero con un solo comando, en modo no interactivo
        if: steps.cambios.outputs.arrancar == 'true'
        run: pnpm local:arrancar -- --no-interactivo
      - name: Las páginas de demostración responden
        if: steps.cambios.outputs.arrancar == 'true'
        run: |
          set -e
          for ruta in panel/muestras panel/sala panel/contador prototipo; do
            curl -fsS "http://127.0.0.1:${AIW_WEB_PUERTO:-3000}/$ruta" > /dev/null
            echo "OK /$ruta"
          done
      - name: Estado de los servicios
        if: always() && steps.cambios.outputs.arrancar == 'true'
        run: docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml ps
      - name: Registros si algo falló
        if: failure() && steps.cambios.outputs.arrancar == 'true'
        run: |
          docker compose --env-file .env -f deploy/compose/docker-compose.dev.yml logs --tail=100
          tail -n 200 .aiw-local/registros/*.log 2>/dev/null || true
      - name: Parar y borrar volúmenes
        if: always() && steps.cambios.outputs.arrancar == 'true'
        run: pnpm local:parar -- --volumenes

  # Construir cinco imágenes tarda lo suyo: solo si el PR toca lo que las afecta.
  # La condición va en los pasos y no en el job: un job con matriz saltado entero
  # publica un solo check sin expandir ("Imagen ${{ matrix.app }}") y las cinco
  # "Imagen <app>" requeridas en main no aparecerían nunca.
  imagenes-decidir:
    name: Imágenes · decidir
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    outputs:
      construir: ${{ steps.cambios.outputs.construir }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: cambios
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$BASE" ]; then
            echo "construir=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(apps/|packages/|deploy/docker/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "construir=true" >> "$GITHUB_OUTPUT"
          else
            echo "construir=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca apps/, packages/, deploy/docker/ ni el lockfile: no se reconstruyen las imágenes."
          fi

  imagenes:
    name: Imagen ${{ matrix.app }}
    runs-on: ${{ fromJSON(vars.AIW_RUNS_ON || '["ubuntu-24.04"]') }}
    needs: [lint, typecheck, test, imagenes-decidir]
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, platform-agents, channels, web]
    env:
      CONSTRUIR: ${{ needs.imagenes-decidir.outputs.construir }}
    steps:
      - name: Sin cambios que afecten a las imágenes
        if: env.CONSTRUIR != 'true'
        run: echo "::notice::El PR no toca apps/, packages/, deploy/docker/ ni el lockfile. No se construye la imagen ${{ matrix.app }}."
      - uses: actions/checkout@v5
        if: env.CONSTRUIR == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.CONSTRUIR == 'true'
        with:
          # Los auto-hospedados no traen buildx: se descarga en la caché de herramientas del job.
          version: ${{ runner.environment == 'self-hosted' && 'latest' || '' }}
      - name: Construir sin publicar
        if: env.CONSTRUIR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app == 'web' && 'deploy/docker/web.Dockerfile' || 'deploy/docker/service.Dockerfile' }}
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: aiw/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: La imagen arranca
        if: env.CONSTRUIR == 'true' && matrix.app != 'web'
        run: docker run --rm aiw/${{ matrix.app }}:ci
