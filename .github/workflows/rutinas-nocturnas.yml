name: Rutinas nocturnas

# Vía de respaldo en GitHub Actions para el Evaluador (01:00 UTC) y el Cronista (02:00 UTC).
# La vía primaria recomendada son las Rutinas de Claude Code; nunca las dos a la vez.
# Ver docs/runbooks/proteccion-de-rama.md. Desactivadas hasta que exista la variable de repositorio
# RUTINAS_NOCTURNAS=true. Requieren ANTHROPIC_API_KEY o CLAUDE_CODE_OAUTH_TOKEN, más NOTION_TOKEN; el Cronista
# necesita además CRONISTA_TOKEN, porque los PR abiertos con GITHUB_TOKEN no disparan la CI ni al Revisor.

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      rutina:
        description: Rutina a ejecutar
        required: true
        type: choice
        options: [cronista, evaluador]

jobs:
  comprobar:
    name: Comprobar activación y secretos
    if: vars.RUTINAS_NOCTURNAS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      hay_clave: ${{ steps.clave.outputs.hay_clave }}
    steps:
      - id: clave
        env:
          HAY_CLAVE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAY_TOKEN_CRONISTA: ${{ secrets.CRONISTA_TOKEN != '' }}
        run: |
          echo "hay_clave=$HAY_CLAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAY_CLAVE" != "true" ]; then
            echo "::error::RUTINAS_NOCTURNAS está activa pero faltan ANTHROPIC_API_KEY y CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi
          if [ "$HAY_TOKEN_CRONISTA" != "true" ]; then
            echo "::warning::Sin CRONISTA_TOKEN: los PR que abra el Cronista con GITHUB_TOKEN no dispararán la CI ni al Revisor."
          fi

  evaluador:
    name: Evaluador
    needs: comprobar
    if: >-
      needs.comprobar.outputs.hay_clave == 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.rutina == 'evaluador'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v5
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: anthropics/claude-code-action@v1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        with:
          # Claude Code prefiere la clave de la API al token cuando recibe los dos; con token, la clave no se pasa.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Lee .claude/routines/evaluador.md y ejecuta el bloque de prompt que contiene, tal cual.
          # El action fusiona los --mcp-config como un solo JSON y no carga rutas de archivo: la configuración
          # de Notion va en línea (misma que .github/mcp/notion.json), con NOTION_TOKEN declarado de forma explícita.
          claude_args: |
            --model ${{ vars.REVISOR_MODELO || 'claude-sonnet-5' }}
            --max-turns 50
            --mcp-config '{"mcpServers":{"Notion":{"command":"npx","args":["-y","@notionhq/notion-mcp-server"],"env":{"NOTION_TOKEN":"${NOTION_TOKEN}"}}}}'
            --allowedTools "Read,Grep,Glob,Bash(pnpm:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(git log:*),mcp__Notion"

  cronista:
    name: Cronista
    needs: comprobar
    if: >-
      needs.comprobar.outputs.hay_clave == 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.rutina == 'cronista'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Con CRONISTA_TOKEN los PR del Cronista disparan la CI y al Revisor; con GITHUB_TOKEN no.
          token: ${{ secrets.CRONISTA_TOKEN || github.token }}
      - uses: anthropics/claude-code-action@v1
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.CRONISTA_TOKEN || github.token }}
        with:
          # Claude Code prefiere la clave de la API al token cuando recibe los dos; con token, la clave no se pasa.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CRONISTA_TOKEN || github.token }}
          prompt: Lee .claude/routines/cronista.md y ejecuta el bloque de prompt que contiene, tal cual.
          # El action fusiona los --mcp-config como un solo JSON y no carga rutas de archivo: la configuración
          # de Notion va en línea (misma que .github/mcp/notion.json), con NOTION_TOKEN declarado de forma explícita.
          claude_args: |
            --model ${{ vars.REVISOR_MODELO || 'claude-sonnet-5' }}
            --max-turns 40
            --mcp-config '{"mcpServers":{"Notion":{"command":"npx","args":["-y","@notionhq/notion-mcp-server"],"env":{"NOTION_TOKEN":"${NOTION_TOKEN}"}}}}'
            --allowedTools "Read,Grep,Glob,Write,Edit,Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*),Bash(git status:*),mcp__Notion"
